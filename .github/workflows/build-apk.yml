name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/promtlab-debug.apk
          ls -lh artifacts/
          sha256sum artifacts/promtlab-debug.apk | tee artifacts/promtlab-debug.apk.sha256

      - name: Commit artifact to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/promtlab-debug.apk artifacts/promtlab-debug.apk.sha256
          git commit -m "build: promtlab-debug.apk (CI artifact)"
          git push
