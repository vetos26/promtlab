name: Startup diagnostics

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  startup:
    name: Run app startup tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests with full stack traces
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:testDebugUnitTest --console=plain --info > build.log 2>&1
          code=$?
          echo "GRADLE_EXIT=$code"
          python3 - <<'PY' || true
          import glob, re, textwrap
          import xml.etree.ElementTree as ET

          messages = []
          # JUnit XML содержит полный текст исключения
          for path in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          text = (node.get("message") or "") + "\n" + (node.text or "")
                          head = [c for c in text.splitlines()
                                  if c.strip() and not c.strip().startswith("at ")]
                          tail = [c for c in text.splitlines() if c.strip().startswith("at com.promtlab")][:4]
                          messages.append(f"{case.get('classname')}.{case.get('name')}: " +
                                          " | ".join(head[:3] + tail))
          if not messages:
              text = open("build.log", encoding="utf-8", errors="replace").read()
              for line in text.splitlines():
                  if re.search(r"(^e: |error:|FAILED|Caused by)", line):
                      messages.append(line.strip())
          seen = []
          for item in messages:
              if item not in seen:
                  seen.append(item)
          for item in seen[:10]:
              msg = item.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=startup::{msg[:1400]}")
          print(f"::error title=startup-count::{len(seen)} failures")
          PY
          exit $code
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            build.log
          if-no-files-found: warn
