name: Debug build report

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  compile:
    name: Compile diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and collect errors
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --continue --console=plain > build.log 2>&1
          code=$?
          echo "GRADLE_EXIT=$code"
          python3 - <<'PY' || true
          import re
          lines = []
          for raw in open("build.log", encoding="utf-8", errors="replace"):
              line = raw.rstrip()
              if re.search(r"^e: |error:|FAILED|Execution failed|^> Task .*FAILED|Test.*failed", line):
                  lines.append(line.strip())
          # переносим ошибки в аннотации (их читает агент через API)
          for line in lines[:12]:
              msg = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=diag::{msg[:900]}")
          print(f"::error title=diag-count::{len(lines)} error lines")
          PY
          exit $code
      - name: Publish diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          try:
              body = open("diagnostics.md", encoding="utf-8").read()
          except FileNotFoundError:
              body = "diagnostics.md not produced"
          body = body[:60000]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": f"Bearer {token}",
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json",
                       "User-Agent": "promtlab-ci"},
              method="POST")
          try:
              print(urllib.request.urlopen(req).status)
          except Exception as exc:
              print("comment failed:", exc)
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
