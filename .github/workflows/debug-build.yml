name: Startup diagnostics

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  startup:
    name: Run app startup tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests with full stack traces
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:testDebugUnitTest --console=plain --info > build.log 2>&1
          code=$?
          echo "GRADLE_EXIT=$code"
          python3 - <<'PY' || true
          import re
          text = open("build.log", encoding="utf-8", errors="replace").read()
          lines = [l.strip() for l in text.splitlines()
                   if re.search(r"(FAILED|Exception|Error|Caused by|at com\.promtlab|Robolectric)", l)]
          uniq = []
          for line in lines:
              if line not in uniq:
                  uniq.append(line)
          for line in uniq[:14]:
              msg = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=startup::{msg[:900]}")
          print(f"::error title=startup-count::{len(uniq)} diagnostic lines")
          PY
          exit $code
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            build.log
          if-no-files-found: warn
