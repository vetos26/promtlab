name: Startup diagnostics

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  startup:
    name: Run app startup tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests with full stack traces
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:testDebugUnitTest --console=plain --info > build.log 2>&1
          code=$?
          echo "GRADLE_EXIT=$code"
          python3 - <<'PY' || true
          import glob, re, textwrap
          import xml.etree.ElementTree as ET

          messages = []
          # JUnit XML содержит полный текст исключения
          for path in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          text = (node.get("message") or "") + "\n" + (node.text or "")
                          head = [c for c in text.splitlines()
                                  if c.strip() and not c.strip().startswith("at ")]
                          tail = [c for c in text.splitlines() if c.strip().startswith("at com.promtlab")][:4]
                          messages.append(f"{case.get('classname')}.{case.get('name')}: " +
                                          " | ".join(head[:3] + tail))
          if not messages:
              text = open("build.log", encoding="utf-8", errors="replace").read()
              for line in text.splitlines():
                  if re.search(r"(^e: |error:|FAILED|Caused by)", line):
                      messages.append(line.strip())
          seen = []
          for item in messages:
              if item not in seen:
                  seen.append(item)
          for item in seen[:10]:
              msg = item.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=startup::{msg[:1400]}")
          print(f"::error title=startup-count::{len(seen)} failures")
          PY
          exit $code
      - name: Publish full report to issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' || true
          import glob, json, os, urllib.request
          import xml.etree.ElementTree as ET

          chunks = []
          for path in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is None:
                          continue
                      text = (node.get("message") or "") + "\n" + (node.text or "")
                      lines = text.splitlines()
                      cause_idx = next((i for i, l in enumerate(lines) if "Caused by" in l), None)
                      if cause_idx is not None:
                          head = "\n".join(lines[:6] + ["..."] + lines[cause_idx:cause_idx + 25])
                      else:
                          head = "\n".join(lines[:30])
                      chunks.append(f"### {case.get('classname')}.{case.get('name')}\n```\n{head}\n```")
          body = "# Startup test report\n\n" + ("\n\n".join(chunks) or "all green")
          body = body[:60000]

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {"Authorization": f"Bearer {token}",
                     "Accept": "application/vnd.github+json",
                     "User-Agent": "promtlab-ci",
                     "Content-Type": "application/json"}

          def call(url, method="GET", payload=None):
              data = json.dumps(payload).encode() if payload else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              return json.loads(urllib.request.urlopen(req).read())

          issues = call(f"https://api.github.com/repos/{repo}/issues?state=open&labels=startup-report")
          if issues:
              call(issues[0]["comments_url"], "POST", {"body": body})
              print("comment added to", issues[0]["number"])
          else:
              call(f"https://api.github.com/repos/{repo}/issues", "POST", {
                  "title": "Startup test report",
                  "body": body,
                  "labels": ["startup-report"],
              })
              print("issue created")
          PY
