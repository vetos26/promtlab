name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK & run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: promtlab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Артефакты Actions недоступны из рабочей среды, поэтому APK
      # коммитится в ветку и забирается напрямую через git.
      - name: Publish APK to branch
        if: github.ref_type == 'branch'
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/promtlab-debug.apk
          sha256sum artifacts/promtlab-debug.apk | awk '{print $1}' > artifacts/promtlab-debug.apk.sha256
          ls -lh artifacts/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/promtlab-debug.apk artifacts/promtlab-debug.apk.sha256
          if git diff --staged --quiet; then
            echo "APK unchanged"
          else
            git commit -m "build: promtlab-debug.apk [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
